[package]
name = "kubuntu-usb-sync"
version = "0.1.1"
edition = "2021"
description = "Kubuntu USB stick sync, flash and VM tool (egui GUI over lsblk, unison, qemu, curl)"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
opt-level = 1
